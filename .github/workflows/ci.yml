name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/family-finance-mvp

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # corepack picks up the pnpm version pinned in package.json ("packageManager").
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release-gate commands from docs/runbooks/local-mvp-verification.md.
      # The web build stays green with placeholder env (lazy env getters).
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Category migrations and atomic edits
        run: pnpm test:category-migration

      - name: Verify migration controller and idempotency
        run: pnpm test:migrations

      - name: Build web
        run: pnpm --filter @family-finance/web build

      - name: Build bot
        run: pnpm --filter @family-finance/bot build
